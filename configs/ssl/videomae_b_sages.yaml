# VideoMAE ViT-B continued pretraining on SAGES — experiment E2.1
#
# Clip geometry reproduces the checkpoint's own Kinetics configuration:
# 16 frames at sampling rate 4. SAGES is 30 fps, so a clip spans 2.1 s, the
# same temporal window the encoder was pretrained on.
#
# Learning rate follows the linear scaling rule from VideoMAE's recipe
# (base_lr 1.5e-4 per 256 samples) at the batch size a single V100 permits.
# SSL hyperparameters are otherwise unmodified from the published recipe and
# are not tuned; see docs/experimental_design.md §8.

seed: 0
output_dir: /group/pmc085/hlionar/outputs/cvs-domain-ssl/ssl/videomae_b_sages

model:
  checkpoint: MCG-NJU/videomae-base
  gradient_checkpointing: false     # enable for ViT-L

data:
  video_dir: /group/pmc085/hlionar/datasets/SAGES_CVS_Challenge_2024/train/videos
  num_frames: 16
  stride: 4
  clips_per_video: 40
  image_size: 224
  crop_scale: [0.5, 1.0]
  # Decode at 256 rather than natively: a 16-frame clip at 1280x720 in float32
  # is 176 MB, which with several prefetching workers exhausts host memory.
  decode_size: 256
  reader_cache_size: 4
  # Cholec80 video 66 duplicates Endoscapes validation video 121. Listed here
  # for when the corpus is extended; SAGES itself has no documented overlap.
  exclude_video_ids: []

train:
  batch_size: 8
  epochs: 20
  lr: 1.5e-4
  min_lr_ratio: 0.01
  weight_decay: 0.05
  betas: [0.9, 0.95]
  mask_ratio: 0.9
  grad_clip: 1.0
  warmup_steps: 2000
  num_workers: 8
  prefetch_factor: 4
  save_every_steps: 500
  log_every_steps: 20